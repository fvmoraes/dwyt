name: CI

on:
  push:
    branches: [ main, 'fix/**', 'feat/**', 'plan/**' ]
    paths:
      - "core/**"
      - "install.sh"
      - "install.ps1"
      - "install-lib/**"
      - ".golangci.yml"
      - ".github/workflows/**"
      - "plan/**"
      - "docs/**"
      - "readme.md"
  pull_request:
    branches: [ main ]
    paths:
      - "core/**"
      - "install.sh"
      - "install.ps1"
      - "install-lib/**"
      - ".golangci.yml"
      - ".github/workflows/**"
      - "plan/**"
      - "docs/**"
      - "readme.md"

permissions:
  contents: read

jobs:
  test:
    name: Go + frontend tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: core/go.sum

      - name: Check go.mod tidiness
        working-directory: core
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Test
        working-directory: core
        shell: bash
        run: |
          set -o pipefail
          go test -shuffle=on -count=1 ./... 2>&1 | tee /tmp/go-test-output.txt

      - name: Report failing tests
        if: failure()
        shell: bash
        run: |
          if [[ ! -f /tmp/go-test-output.txt ]]; then
            {
              echo "### Go test output unavailable"
              echo "The test step did not run; inspect the first failed step above."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Emit failing test names as workflow annotations (readable via the
          # public check-runs annotations API) and the output tail as a step
          # summary, so Windows failures are diagnosable without log access.
          grep -E "^--- FAIL" /tmp/go-test-output.txt | head -10 | while IFS= read -r line; do
            echo "::error::${line//::/\\::}"
          done
          grep -E "^    [A-Za-z_]+\.go:[0-9]+:" /tmp/go-test-output.txt | head -20 | while IFS= read -r line; do
            echo "::error::${line//::/\\::}"
          done
          {
            echo "### Go test output (tail)"
            echo '```'
            tail -n 150 /tmp/go-test-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: core/web/package-lock.json

      - name: Lint frontend
        working-directory: core/web
        run: npm ci && npm run lint

      - name: Build frontend
        working-directory: core/web
        run: npm run build

      - name: Check embedded frontend is current
        run: git diff --exit-code -- core/internal/server/dashboard/dist

      - name: Vet
        working-directory: core
        run: go vet ./...

      - name: Build
        working-directory: core
        run: go build ./...

      - name: Validate Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE 'install.ps1'),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            throw ($parseErrors | Out-String)
          }

  darwin-build:
    name: Darwin CLI build (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: core/go.sum

      - name: Build Darwin CLI artifact
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          GOOS=darwin GOARCH="${{ matrix.goarch }}" CGO_ENABLED=0 \
            go build -trimpath -o "dist/dwyt_darwin_${{ matrix.goarch }}" .
          test -s "dist/dwyt_darwin_${{ matrix.goarch }}"
          file "dist/dwyt_darwin_${{ matrix.goarch }}"

  installer-e2e:
    name: Sandboxed installer lifecycle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: core/go.sum

      - name: Verify POSIX install, reinstall, and uninstall preservation
        if: runner.os != 'Windows'
        working-directory: core
        shell: bash
        run: bash test/install-lifecycle.sh "$GITHUB_WORKSPACE"

      - name: Verify Windows install, reinstall, and uninstall preservation
        if: runner.os == 'Windows'
        working-directory: core
        shell: pwsh
        run: .\test\install-lifecycle.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE

  docs:
    name: Documentation consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: core/go.sum

      - name: Validate documentation contracts and links
        working-directory: core
        run: go test ./internal/integrate -run '^(TestDocumentation|TestActiveDocumentation)' -count=1

  race:
    # Data races are undefined behavior; run the detector on the two fastest
    # runners. Windows is skipped: its race builds are slow and the same code
    # paths are covered by the unix race runs.
    name: Race detector (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: core/go.sum

      - name: Race tests
        working-directory: core
        run: go test -race -shuffle=on -count=1 ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: core/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          working-directory: core

  govulncheck:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: core/go.sum

      - name: govulncheck
        working-directory: core
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...
