name: CI

on:
  push:
    branches: [ main, 'fix/**', 'feat/**' ]
    paths:
      - "core/**"
      - "install.ps1"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "core/**"
      - "install.ps1"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: Go + frontend tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: core/go.sum

      - name: Test
        working-directory: core
        shell: bash
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee /tmp/go-test-output.txt

      - name: Report failing tests
        if: failure()
        shell: bash
        run: |
          # Emit failing test names as workflow annotations (readable via the
          # public check-runs annotations API) and the output tail as a step
          # summary, so Windows failures are diagnosable without log access.
          grep -E "^--- FAIL" /tmp/go-test-output.txt | head -10 | while IFS= read -r line; do
            echo "::error::${line//::/\\::}"
          done
          grep -E "^    [A-Za-z_]+\.go:[0-9]+:" /tmp/go-test-output.txt | head -20 | while IFS= read -r line; do
            echo "::error::${line//::/\\::}"
          done
          {
            echo "### Go test output (tail)"
            echo '```'
            tail -n 150 /tmp/go-test-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Vet
        working-directory: core
        run: go vet ./...

      - name: Build
        working-directory: core
        run: go build ./...

      - name: Validate Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE 'install.ps1'),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            throw ($parseErrors | Out-String)
          }

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: core/web/package-lock.json

      - name: Lint frontend
        working-directory: core/web
        run: npm ci && npm run lint

      - name: Build frontend
        working-directory: core/web
        run: npm run build
